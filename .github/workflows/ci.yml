name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sabz_zendegi
          POSTGRES_USER: sabz_zendegi
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sabz_zendegi -d sabz_zendegi"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://sabz_zendegi:ci-password@localhost:5432/sabz_zendegi?schema=public
      JWT_ACCESS_SECRET: ci-only-jwt-access-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ
      REFRESH_TOKEN_PEPPER: ci-only-refresh-token-pepper-9876543210-ZYXWVUTSRQPONMLKJIHGFEDCBA
      OTP_PEPPER: ci-only-otp-pepper-9876543210-ZYXWVUTSRQPONMLKJIHGFEDCBA
      NODE_ENV: test
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sabz-zendegi/api prisma:generate
      - run: pnpm --filter @sabz-zendegi/api exec prisma validate
      - run: pnpm --filter @sabz-zendegi/api prisma:migrate:deploy
      - run: pnpm --filter @sabz-zendegi/api prisma:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Wallet financial integration in an isolated disposable database
        env:
          DATABASE_URL: postgresql://sabz_zendegi:ci-password@localhost:5432/wallet_test?schema=public
          WALLET_BILLING_TEST_ISOLATED: '1'
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U sabz_zendegi wallet_test
          pnpm --filter @sabz-zendegi/api prisma:migrate:deploy
          pnpm --filter @sabz-zendegi/api prisma:seed
          export PAYMENT_CREDENTIAL_ENCRYPTION_KEY="$(node -e 'process.stdout.write(Buffer.alloc(32, 7).toString("base64"))')"
          pnpm --filter @sabz-zendegi/api exec vitest run test/wallet-billing.integration.spec.ts --no-file-parallelism
      - run: pnpm build
      - name: Assessment reliability in an isolated disposable database
        env:
          DATABASE_URL: postgresql://sabz_zendegi:ci-password@localhost:5432/patient_journey_test?schema=public
          PATIENT_JOURNEY_TEST_ISOLATED: '1'
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U sabz_zendegi patient_journey_test
          pnpm --filter @sabz-zendegi/api prisma:migrate:deploy
          pnpm --filter @sabz-zendegi/api prisma:seed
          pnpm --filter @sabz-zendegi/api exec vitest run test/assessment-reliability.integration.spec.ts test/patient-journey.integration.spec.ts test/assessment-discovery.integration.spec.ts test/assessment-offerings.integration.spec.ts test/assessment-authoring.integration.spec.ts test/couple-link.integration.spec.ts test/guidance-content.integration.spec.ts test/assessment-guidance.integration.spec.ts --no-file-parallelism
      - name: Install browser for existing access smoke suite
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser session and access smoke
        run: pnpm exec playwright test --config playwright.ci.config.ts

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Scan committed source for exposed secrets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/secret-source"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/secret-source"
          # Only locations/rule IDs are logged, never the detected secret contents.
          docker run --rm -v "$RUNNER_TEMP/secret-source:/source:ro" aquasec/trivy:0.75.0 fs --scanners secret --exit-code 1 --format template --template '{{range .}}{{$path := .Target}}{{range .Secrets}}{{$path}}:{{.StartLine}} {{.RuleID}}{{printf "\n"}}{{end}}{{end}}' /source
