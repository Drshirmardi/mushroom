name: Deploy production

on:
  workflow_run:
    workflows: [Release and stage]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release and stage workflow run ID whose staging deployment is accepted
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  production:
    if: >-
      vars.PRODUCTION_CD_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && vars.PRODUCTION_AUTO_DEPLOY == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production-vps
      cancel-in-progress: false
    steps:
      - name: Authorize the explicit owner promotion
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVER: ${{ vars.RELEASE_APPROVER }}
          ACTOR: ${{ github.actor }}
          PRODUCTION_CD_ENABLED: ${{ vars.PRODUCTION_CD_ENABLED }}
        run: |
          test "$PRODUCTION_CD_ENABLED" = 'true' || { echo 'VPS CD is not enabled'; exit 1; }
          test -n "$APPROVER" || { echo 'RELEASE_APPROVER is not configured'; exit 1; }
          test "${ACTOR,,}" = "${APPROVER,,}" || { echo "Only RELEASE_APPROVER may promote"; exit 1; }
      - name: Validate repository-scoped VPS inputs
        env:
          VPS_HOST: ${{ secrets.PRODUCTION_VPS_HOST }}
          VPS_USER: ${{ secrets.PRODUCTION_VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST" || { echo 'VPS_HOST repository secret is not configured'; exit 1; }
          test -n "$VPS_USER" || { echo 'VPS_USER repository secret is not configured'; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo 'VPS_SSH_PRIVATE_KEY repository secret is not configured'; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'VPS_KNOWN_HOSTS repository secret is not configured'; exit 1; }
      - id: accepted
        name: Verify the source workflow and successful staging job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id || github.event.workflow_run.id }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'release_run_id must be numeric'; exit 1; }
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          run_json=$(curl --fail --silent --show-error --location "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")
          jq -e '.name == "Release and stage" and .event == "workflow_run" and .conclusion == "success"' \
            <<<"$run_json" >/dev/null
          jobs_json=$(curl --fail --silent --show-error --location "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100")
          jq -e '[.jobs[] | select(.name == "deploy-staging" and .conclusion == "success")] | length == 1' \
            <<<"$jobs_json" >/dev/null
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.release_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - id: manifest
        name: Read trusted release metadata
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id || github.event.workflow_run.id }}
        run: |
          jq -e --arg run "$RELEASE_RUN_ID" \
            '.releaseRunId == $run and (.sourceSha | test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/release/release-manifest.json" >/dev/null
          echo "source-sha=$(jq -r '.sourceSha' "$RUNNER_TEMP/release/release-manifest.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.manifest.outputs.source-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate the staging-accepted release manifest with its release code
        run: node scripts/release-manifest.mjs "$RUNNER_TEMP/release/release-manifest.json"
      - name: Prepare pinned SSH material
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id" "$RUNNER_TEMP/ssh/known_hosts"
      - name: Promote the accepted manifest without rebuilding
        env:
          VPS_HOST: ${{ secrets.PRODUCTION_VPS_HOST }}
          VPS_PORT: ${{ vars.PRODUCTION_VPS_PORT }}
          VPS_USER: ${{ secrets.PRODUCTION_VPS_USER }}
          VPS_SSH_KEY_PATH: ${{ runner.temp }}/ssh/id
          VPS_KNOWN_HOSTS_PATH: ${{ runner.temp }}/ssh/known_hosts
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-vps.mjs deploy production "$RUNNER_TEMP/release/release-manifest.json"
