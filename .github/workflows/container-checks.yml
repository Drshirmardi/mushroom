name: Release artifact checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/docker/**'
      - 'docker-bake.hcl'
      - '*compose*.yaml'
      - '.dockerignore'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/ci-container-smoke.mjs'
      - 'scripts/release-images.mjs'
      - '.github/workflows/container-checks.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/docker/**'
      - 'docker-bake.hcl'
      - '*compose*.yaml'
      - '.dockerignore'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/ci-container-smoke.mjs'
      - 'scripts/release-images.mjs'
      - '.github/workflows/container-checks.yml'

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, app, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Build production artifact without publishing
        uses: docker/bake-action@v6
        with:
          source: .
          files: ./docker-bake.hcl
          targets: ${{ matrix.service }}
          load: true
          pull: true
          set: |
            ${{ matrix.service }}.tags=mushroom-ci:${{ matrix.service }}
            ${{ matrix.service }}.cache-from=type=gha,scope=${{ matrix.service }}
            ${{ matrix.service }}.cache-to=type=gha,mode=max,scope=${{ matrix.service }}
      - name: Disposable artifact smoke and cleanup
        run: node scripts/ci-container-smoke.mjs mushroom-ci:${{ matrix.service }} ${{ matrix.service }}
      - name: Scan actual runtime image (no Critical/High waiver)
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/image-scan"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/image-scan:/reports" aquasec/trivy:0.75.0 image --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --format json --output /reports/scan.json mushroom-ci:${{ matrix.service }}
      - name: Preserve vulnerability evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-${{ matrix.service }}
          path: ${{ runner.temp }}/image-scan/scan.json
          if-no-files-found: warn
