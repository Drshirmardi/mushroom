name: Sync shared dev VPS

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      sms_transport_mode:
        description: Optional SMS transport mode to apply on the shared dev VPS before sync
        required: false
        default: unchanged
        type: choice
        options: [unchanged, disabled, live]

permissions:
  contents: read

concurrency:
  group: shared-dev-vps
  cancel-in-progress: false

jobs:
  sync:
    if: vars.VPS_DEV_CD_ENABLED == 'true' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate repository-scoped VPS inputs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST" || { echo 'VPS_HOST repository secret is not configured'; exit 1; }
          test -n "$VPS_USER" || { echo 'VPS_USER repository secret is not configured'; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo 'VPS_SSH_PRIVATE_KEY repository secret is not configured'; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'VPS_KNOWN_HOSTS repository secret is not configured'; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare pinned SSH material
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id" "$RUNNER_TEMP/ssh/known_hosts"
      - name: Apply requested shared-dev SMS runtime mode
        if: github.event_name == 'workflow_dispatch' && inputs.sms_transport_mode != 'unchanged'
        env:
          MODE: ${{ inputs.sms_transport_mode }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_PATH: ${{ runner.temp }}/ssh/id
          VPS_KNOWN_HOSTS_PATH: ${{ runner.temp }}/ssh/known_hosts
        run: |
          case "$MODE" in live|disabled) ;; *) exit 2 ;; esac
          port="${VPS_PORT:-22}"
          ssh -p "$port" -i "$VPS_SSH_KEY_PATH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$VPS_KNOWN_HOSTS_PATH" "$VPS_USER@$VPS_HOST" "sed -i 's/^SMS_TRANSPORT_MODE=.*/SMS_TRANSPORT_MODE=$MODE/' \"\$HOME/mushroom/dev/runtime.env\""
      - name: Sync source and verify shared dev
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_PATH: ${{ runner.temp }}/ssh/id
          VPS_KNOWN_HOSTS_PATH: ${{ runner.temp }}/ssh/known_hosts
        run: node scripts/deploy-dev-vps.mjs "$GITHUB_SHA"
