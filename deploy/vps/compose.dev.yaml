name: ${COMPOSE_PROJECT_NAME:?set the isolated dev Compose project name}

x-node-service: &node-service
  image: mushroom-dev-runtime:local
  user: "${DEV_UID:?set the deployment user UID}:${DEV_GID:?set the deployment user GID}"
  working_dir: /workspace
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment: &node-environment
    HOME: /home/dev
    PNPM_HOME: /home/dev/.local/share/pnpm
    NEXT_TELEMETRY_DISABLED: "1"
    TURBO_TELEMETRY_DISABLED: "1"
    NEXT_ALLOWED_DEV_ORIGINS: "${APP_ORIGINS:?set explicit dev browser origins}"
  volumes: &node-volumes
    - "${DEV_WORKSPACE_PATH:?set the absolute dev workspace path}:/workspace"
    - "${DEV_CACHE_PATH:?set the absolute dev cache path}:/home/dev"
  restart: unless-stopped

services:
  postgres:
    image: "${POSTGRES_IMAGE:-postgres:16-alpine}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set the isolated dev database name}"
      POSTGRES_USER: "${POSTGRES_USER:?set the isolated dev database user}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: []
    restart: unless-stopped
    cpus: "${DEV_POSTGRES_CPUS:-0.50}"
    mem_limit: "${DEV_POSTGRES_MEMORY:-512m}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  bootstrap:
    image: mushroom-dev-runtime:local
    build:
      context: "${DEV_WORKSPACE_PATH:?set the absolute dev workspace path}"
      dockerfile: deploy/vps/Dockerfile.dev
      args:
        DEBIAN_MIRROR: https://mirror.famaserver.com/debian
        DEBIAN_SECURITY_MIRROR: https://security.debian.org/debian-security
      secrets: [dev_apt_ca]
      entitlements:
        - fs.read=/etc/ssl/certs/ca-certificates.crt
    user: "${DEV_UID:?set the deployment user UID}:${DEV_GID:?set the deployment user GID}"
    working_dir: /workspace
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      <<: *node-environment
      SADAD_RETURN_URL: "${SADAD_RETURN_URL:-}"
      DEV_INSTALL_DEPENDENCIES: "${DEV_INSTALL_DEPENDENCIES:-false}"
      DEV_RUN_SEED: "${DEV_RUN_SEED:-false}"
      DEV_BUILD_API_CLIENT: "${DEV_BUILD_API_CLIENT:-false}"
      DEV_GENERATE_PRISMA: "${DEV_GENERATE_PRISMA:-false}"
      DEV_RUN_MIGRATIONS: "${DEV_RUN_MIGRATIONS:-false}"
      DEV_COMPILE_API: "${DEV_COMPILE_API:-false}"
      DEV_API_SOURCE_HASH: "${DEV_API_SOURCE_HASH:-}"
      DEV_WRITE_RUNTIME_CONFIG: "${DEV_WRITE_RUNTIME_CONFIG:-false}"
      PUBLIC_GA4_MEASUREMENT_ID: "${PUBLIC_GA4_MEASUREMENT_ID:-}"
      PUBLIC_ANALYTICS_CONSENT: "${PUBLIC_ANALYTICS_CONSENT:-denied}"
      PUBLIC_ANALYTICS_DEBUG: "${PUBLIC_ANALYTICS_DEBUG:-false}"
      PUBLIC_API_URL: "${PUBLIC_API_URL:?set the public dev API URL}"
      PUBLIC_WEB_URL: "${PUBLIC_WEB_URL:?set the public dev web URL}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:?set the public dev app URL}"
      PUBLIC_DASHBOARD_URL: "${PUBLIC_DASHBOARD_URL:?set the public dev dashboard URL}"
    volumes:
      - "${DEV_WORKSPACE_PATH:?set the absolute dev workspace path}:/workspace"
      - "${DEV_CACHE_PATH:?set the absolute dev cache path}:/home/dev"
      - "${MUSHROOM_ENV_ROOT:?set the dev root}/bootstrap:/run/mushroom-installation"
    secrets: [database_url]
    command: ["bash", "deploy/vps/dev-service.sh", "bootstrap"]
    profiles: [tools]

  api:
    <<: *node-service
    command: ["bash", "deploy/vps/dev-service.sh", "api"]
    volumes:
      - "${DEV_WORKSPACE_PATH:?set the absolute dev workspace path}:/workspace"
      - "${DEV_CACHE_PATH:?set the absolute dev cache path}:/home/dev"
      - "${MUSHROOM_ENV_ROOT:?set the dev root}/secrets:/run/optional-secrets:ro"
    environment:
      <<: *node-environment
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      ANALYTICS_SERVER_ENABLED: "${ANALYTICS_SERVER_ENABLED:-false}"
      GA4_API_SECRET_FILE: "${GA4_API_SECRET_FILE:-/run/optional-secrets/ga4_api_secret}"
      JWT_ACCESS_ISSUER: "${JWT_ACCESS_ISSUER:-sabz-zendegi-api}"
      JWT_ACCESS_AUDIENCE: "${JWT_ACCESS_AUDIENCE:-sabz-zendegi-frontends}"
      COMMERCE_RESERVATION_TTL_MINUTES: "${COMMERCE_RESERVATION_TTL_MINUTES:-20}"
      BILLING_BOOKING_HOLD_MINUTES: "${BILLING_BOOKING_HOLD_MINUTES:-10}"
      PRODUCT_MEDIA_STORAGE_MODE: "${PRODUCT_MEDIA_STORAGE_MODE:-disabled}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_REGION: "${R2_REGION:-auto}"
      R2_ACCESS_KEY_ID_FILE: /run/optional-secrets/r2_access_key_id
      R2_SECRET_ACCESS_KEY_FILE: /run/optional-secrets/r2_secret_access_key
      R2_REQUEST_TIMEOUT_MS: "${R2_REQUEST_TIMEOUT_MS:-5000}"
      ARVAN_ENDPOINT: "${ARVAN_ENDPOINT:-}"
      ARVAN_BUCKET: "${ARVAN_BUCKET:-}"
      ARVAN_REGION: "${ARVAN_REGION:-default}"
      ARVAN_ACCESS_KEY_ID_FILE: /run/optional-secrets/arvan_access_key_id
      ARVAN_SECRET_ACCESS_KEY_FILE: /run/optional-secrets/arvan_secret_access_key
      ARVAN_REQUEST_TIMEOUT_MS: "${ARVAN_REQUEST_TIMEOUT_MS:-5000}"
      APP_ORIGINS: "${APP_ORIGINS:?set dev browser origins}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:?set the reverse proxy IP/CIDR}"
      PAYMENT_CREDENTIAL_ENCRYPTION_KEY_VERSION: "${PAYMENT_CREDENTIAL_ENCRYPTION_KEY_VERSION:-v1}"
      SMS_CREDENTIAL_ENCRYPTION_KEY_VERSION: "${SMS_CREDENTIAL_ENCRYPTION_KEY_VERSION:-v1}"
      SMS_TRANSPORT_MODE: "${SMS_TRANSPORT_MODE:-disabled}"
      SMS_REQUEST_TIMEOUT_MS: "${SMS_REQUEST_TIMEOUT_MS:-5000}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:?set the public dev app URL}"
      PUBLIC_GA4_MEASUREMENT_ID: "${PUBLIC_GA4_MEASUREMENT_ID:-}"
      PUBLIC_ANALYTICS_CONSENT: "${PUBLIC_ANALYTICS_CONSENT:-denied}"
      PUBLIC_ANALYTICS_DEBUG: "${PUBLIC_ANALYTICS_DEBUG:-false}"
      PUBLIC_API_URL: "${PUBLIC_API_URL:?set the public dev API URL}"
      SADAD_TRANSPORT_MODE: "${SADAD_TRANSPORT_MODE:-disabled}"
      SADAD_REQUEST_TIMEOUT_MS: "${SADAD_REQUEST_TIMEOUT_MS:-5000}"
      SADAD_RETURN_URL: "${SADAD_RETURN_URL:-}"
      SADAD_RESULT_URL: "${SADAD_RESULT_URL:-}"
      SADAD_REDIRECT_PROFILE: "${SADAD_REDIRECT_PROFILE:-}"
    secrets:
      - database_url
      - jwt_access_secret
      - refresh_token_pepper
      - payment_credential_encryption_key
      - payment_credential_decryption_keys
      - otp_pepper
      - sms_credential_encryption_key
      - sms_credential_decryption_keys
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["${API_PORT:?set the isolated dev API binding}:3003"]
    cpus: "${DEV_API_CPUS:-1.00}"
    mem_limit: "${DEV_API_MEMORY:-1g}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    <<: *node-service
    command: ["bash", "deploy/vps/dev-service.sh", "web"]
    environment:
      <<: *node-environment
      PUBLIC_GA4_MEASUREMENT_ID: "${PUBLIC_GA4_MEASUREMENT_ID:-}"
      PUBLIC_ANALYTICS_CONSENT: "${PUBLIC_ANALYTICS_CONSENT:-denied}"
      PUBLIC_ANALYTICS_DEBUG: "${PUBLIC_ANALYTICS_DEBUG:-false}"
      PUBLIC_API_URL: "${PUBLIC_API_URL:?set the public dev API URL}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:?set the public dev app URL}"
      PUBLIC_DASHBOARD_URL: "${PUBLIC_DASHBOARD_URL:?set the public dev dashboard URL}"
    ports: ["${WEB_PORT:?set the isolated dev web binding}:3000"]
    cpus: "${DEV_WEB_CPUS:-0.75}"

  app:
    <<: *node-service
    command: ["bash", "deploy/vps/dev-service.sh", "app"]
    environment:
      <<: *node-environment
      PUBLIC_GA4_MEASUREMENT_ID: "${PUBLIC_GA4_MEASUREMENT_ID:-}"
      PUBLIC_ANALYTICS_CONSENT: "${PUBLIC_ANALYTICS_CONSENT:-denied}"
      PUBLIC_ANALYTICS_DEBUG: "${PUBLIC_ANALYTICS_DEBUG:-false}"
      PUBLIC_API_URL: "${PUBLIC_API_URL:?set the public dev API URL}"
      PUBLIC_WEB_URL: "${PUBLIC_WEB_URL:?set the public dev web URL}"
    ports: ["${APP_PORT:?set the isolated dev app binding}:3001"]
    cpus: "${DEV_APP_CPUS:-0.75}"

  dashboard:
    <<: *node-service
    command: ["bash", "deploy/vps/dev-service.sh", "dashboard"]
    environment:
      <<: *node-environment
      PUBLIC_GA4_MEASUREMENT_ID: "${PUBLIC_GA4_MEASUREMENT_ID:-}"
      PUBLIC_ANALYTICS_CONSENT: "${PUBLIC_ANALYTICS_CONSENT:-denied}"
      PUBLIC_ANALYTICS_DEBUG: "${PUBLIC_ANALYTICS_DEBUG:-false}"
      PUBLIC_API_URL: "${PUBLIC_API_URL:?set the public dev API URL}"
      PUBLIC_WEB_URL: "${PUBLIC_WEB_URL:?set the public dev web URL}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:?set the public dev app URL}"
    ports: ["${DASHBOARD_PORT:?set the isolated dev dashboard binding}:3002"]
    cpus: "${DEV_DASHBOARD_CPUS:-0.75}"

volumes:
  postgres_data:

secrets:
  dev_apt_ca:
    file: /etc/ssl/certs/ca-certificates.crt
  postgres_password:
    file: "${MUSHROOM_ENV_ROOT:?set the dev environment root}/secrets/postgres_password"
  database_url:
    file: "${MUSHROOM_ENV_ROOT:?set the dev environment root}/secrets/database_url"
  jwt_access_secret:
    file: "${MUSHROOM_ENV_ROOT:?set the dev environment root}/secrets/jwt_access_secret"
  refresh_token_pepper:
    file: "${MUSHROOM_ENV_ROOT:?set the dev environment root}/secrets/refresh_token_pepper"
  payment_credential_encryption_key:
    file: "${MUSHROOM_ENV_ROOT:?set the dev environment root}/secrets/payment_credential_encryption_key"
  payment_credential_decryption_keys:
    file: "${MUSHROOM_ENV_ROOT:?set the dev environment root}/secrets/payment_credential_decryption_keys"
  otp_pepper:
    file: "${MUSHROOM_ENV_ROOT:?set the dev environment root}/secrets/otp_pepper"
  sms_credential_encryption_key:
    file: "${MUSHROOM_ENV_ROOT:?set the dev environment root}/secrets/sms_credential_encryption_key"
  sms_credential_decryption_keys:
    file: "${MUSHROOM_ENV_ROOT:?set the dev environment root}/secrets/sms_credential_decryption_keys"
