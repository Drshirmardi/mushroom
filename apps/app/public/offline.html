<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f6"><meta name="robots" content="noindex">
  <title>قطع اتصال | دکتر شیرمردی</title>
  <style>
    @font-face{font-family:Yekan;src:url('/fonts/yekan-bakh-variable.woff') format('woff');font-display:swap}
    :root{--brand:#1159fc;--surface:#f2f3f6;--ink:#162846;--muted:#626e82}
    *{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font-family:Yekan,Tahoma,sans-serif}
    main{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:max(32px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 40%,#deedff 0,transparent 60%)}
    section{text-align:center;width:100%;max-width:360px} .art{width:min(100%,240px);height:auto;overflow:visible;margin:0 auto 32px;display:block;animation:float 5s ease-in-out infinite}
    h1{font-size:24px;line-height:1.6;margin:0 0 12px;font-weight:750}p{font-size:15px;line-height:1.9;color:var(--muted);margin:0 auto 28px;max-width:280px}
    button{font:inherit;font-weight:650;border:0;border-radius:18px;background:var(--brand);color:white;min-height:52px;padding:12px 28px;display:inline-flex;gap:10px;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px #1159fc20;max-width:100%}
    button:hover{background:#084ae1}button:focus-visible{outline:3px solid var(--brand);outline-offset:5px}button:disabled{cursor:wait;opacity:.75}button svg{width:20px;height:20px;flex-shrink:0}button:disabled svg{animation:spin 1s linear infinite}
    #message{min-height:48px;margin:20px auto 0;font-size:13px} .caption{font-size:12px;color:#74777c;margin:24px 0 0}
    @keyframes float{50%{transform:translateY(-7px)}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.art,button:disabled svg{animation:none}}
  </style>
</head>
<body><main><section aria-labelledby="title">
  <svg class="art" viewBox="0 0 240 220" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="glass" x1="48" y1="50" x2="193" y2="171" gradientUnits="userSpaceOnUse"><stop stop-color="white"/><stop offset=".5" stop-color="#e9f6ff"/><stop offset="1" stop-color="#8eb8ff"/></linearGradient>
      <linearGradient id="blue" x1="72" y1="80" x2="169" y2="153" gradientUnits="userSpaceOnUse"><stop stop-color="#589bff"/><stop offset="1" stop-color="#1159fc"/></linearGradient>
      <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#2359ac" flood-opacity=".16"/></filter>
    </defs>
    <ellipse cx="120" cy="189" rx="61" ry="8" fill="#1159fc" opacity=".06"/>
    <circle cx="120" cy="107" r="85" stroke="#c8dbf8" stroke-dasharray="3 9"/>
    <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
      <g transform="rotate(-12 78 123)"><path d="M35 125h22" stroke="url(#blue)" stroke-width="12"/><path d="M64 96h22a15 15 0 0 1 15 15v27a15 15 0 0 1-15 15H64a9 9 0 0 1-9-9v-39a9 9 0 0 1 9-9Z" fill="url(#glass)" stroke="white" stroke-width="2"/><path d="M101 108h13m-13 29h13" stroke="url(#blue)" stroke-width="8"/><path d="M65 104h18" stroke="white" stroke-width="3"/></g>
      <g transform="rotate(12 170 100)"><path d="M190 100h18" stroke="url(#blue)" stroke-width="12"/><path d="M150 71h29a9 9 0 0 1 9 9v40a9 9 0 0 1-9 9h-29a15 15 0 0 1-15-15V86a15 15 0 0 1 15-15Z" fill="url(#glass)" stroke="white" stroke-width="2"/><path d="M145 88v7m0 13v7" stroke="#5686dc" stroke-width="4"/><path d="M153 79h22" stroke="white" stroke-width="3"/></g>
    </g>
    <path d="m111 63 5 10m13-18-1 11m15 1-7 8" stroke="#6794d5" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <h1 id="title">اتصال اینترنت قطع شده</h1>
  <p>اتصال اینترنتت رو بررسی کن و دوباره تلاش کن.</p>
  <button id="retry" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"/></svg><span>تلاش دوباره</span></button>
  <p id="message" role="status" aria-live="polite"></p>
  <p class="caption">دکتر شیرمردی</p>
</section></main>
<script>
  const button = document.getElementById('retry');
  const message = document.getElementById('message');
  const here = new URL(location.href);
  let target = here.pathname === '/offline.html' ? new URL(here.searchParams.get('returnTo') || '/', location.origin) : here;
  if (target.origin !== location.origin || target.pathname === '/offline.html') target = new URL('/', location.origin);
  button.addEventListener('click', async () => {
    if (button.disabled) return;
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
    button.querySelector('span').textContent = 'در حال بررسی اتصال…';
    message.textContent = '';
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 6000);
    try {
      const response = await fetch('/connectivity', { cache:'no-store', credentials:'omit', signal:controller.signal });
      if (response.status !== 204 || response.headers.get('X-Mushroom-Connection') !== 'ok') throw new Error('unavailable');
      location.replace(target.href);
    } catch {
      message.textContent = navigator.onLine === false ? 'هنوز اتصال برقرار نشده.' : 'هنوز به برنامه دسترسی نداریم؛ کمی بعد دوباره تلاش کن.';
      button.disabled = false;
      button.removeAttribute('aria-busy');
      button.querySelector('span').textContent = 'تلاش دوباره';
    } finally { clearTimeout(timeout); }
  });
</script></body></html>
